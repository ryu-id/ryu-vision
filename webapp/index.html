<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ryu-vision — File Explorer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/webapp/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-top">
                <h1>📁 ryu-vision</h1>
                <button id="btn-refresh" class="btn-icon" title="Refresh">🔄</button>
            </div>
            <p class="subtitle">File Explorer — Windows</p>
        </header>

        <!-- Breadcrumb navigation -->
        <nav id="breadcrumb" class="breadcrumb">
            <span class="crumb-loading">Memuat...</span>
        </nav>

        <!-- Toolbar -->
        <div class="toolbar">
            <button id="btn-drives" class="btn-tool">💾 Drives</button>
            <span id="status-bar" class="status-bar"></span>
        </div>

        <!-- Main: file list -->
        <main id="file-list" class="file-list">
            <div class="loading">📂 Memuat direktori...</div>
        </main>

        <!-- Error toast -->
        <div id="toast" class="toast hidden"></div>
    </div>
    <script src="/webapp/app.js"></script>
</body>
</html>
